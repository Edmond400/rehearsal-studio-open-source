name: Rehearsal Studio D1/R2 joint recovery preflight

# Use the existing protected production release ref. Do not run the job on a
# PR/work ref or relax the production environment's deployment branches.
on:
  push:
    branches: ['release/v1.5']
    paths: ['.github/workflows/r2-joint-backup.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rehearsal-studio-joint-backup
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ github.repository == 'Edmond400/rehearsal-studio' && (github.repository == 'Edmond400/rehearsal-studio' && github.ref == 'refs/heads/release/v1.5') }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.STUDIO_TEMP_RELEASE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.STUDIO_R2_MIGRATOR_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STUDIO_R2_MIGRATOR_SECRET_ACCESS_KEY }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the copy and database safeguards against isolated fixtures
        run: python tests/test-r2-online-media-migration.py
      - name: Record a consistent joint recovery set and verify all referenced bytes
        run: python scripts/rehearsal-r2-joint-backup.py "$RUNNER_TEMP/studio-joint"
      - name: Retain a private recovery set without printing project data
        uses: actions/upload-artifact@v4
        with:
          name: studio-joint-recovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/studio-joint/rehearsal-preflight.sql
            ${{ runner.temp }}/studio-joint/d1-timetravel.json
            ${{ runner.temp }}/studio-joint/preflight-summary.json
            ${{ runner.temp }}/studio-joint/r2-recovery-manifest.json
            ${{ runner.temp }}/studio-joint/joint-summary.json
            ${{ runner.temp }}/studio-joint/objects/
          retention-days: 7
          if-no-files-found: error
